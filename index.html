<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 🎂</title>

<style>

/* =========================
   BASIC SETUP
========================= */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050817;
    font-family: monospace;
}


/* =========================
   NIGHT PARTY ROOM
========================= */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            #18234a 0%,
            #090d20 45%,
            #03050d 100%
        );
}


/* =========================
   STARS
========================= */

.star {
    position: absolute;

    width: 4px;
    height: 4px;

    background: #fff3c4;

    box-shadow: 0 0 5px #fff3c4;

    opacity: 0.7;
}

.star:nth-child(1) { left: 8%; top: 15%; }
.star:nth-child(2) { left: 18%; top: 29%; }
.star:nth-child(3) { left: 27%; top: 12%; }
.star:nth-child(4) { left: 39%; top: 22%; }
.star:nth-child(5) { left: 62%; top: 13%; }
.star:nth-child(6) { left: 74%; top: 25%; }
.star:nth-child(7) { left: 86%; top: 14%; }
.star:nth-child(8) { left: 93%; top: 31%; }


/* =========================
   FAIRY LIGHTS
========================= */

.fairy-lights {
    position: absolute;

    top: 7%;
    left: 5%;

    width: 90%;
    height: 35px;

    border-top: 3px solid #25294a;

    transform: rotate(2deg);
}

.light {
    position: absolute;

    width: 12px;
    height: 16px;

    background: #e8b95a;

    box-shadow:
        0 0 12px #e8b95a;
}

.light:nth-child(1) { left: 5%; top: 8px; }
.light:nth-child(2) { left: 20%; top: 13px; }
.light:nth-child(3) { left: 35%; top: 17px; }
.light:nth-child(4) { left: 50%; top: 20px; }
.light:nth-child(5) { left: 65%; top: 16px; }
.light:nth-child(6) { left: 80%; top: 11px; }


/* =========================
   TABLE
========================= */

.table {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 27%;

    background: #24161a;

    border-top: 8px solid #49302b;
}

.table::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 7px;

    background: #7a4b3d;
}


/* =========================
   FALLING BULB
========================= */

.bulb {
    position: absolute;

    z-index: 5;

    left: 50%;
    top: -120px;

    width: 30px;
    height: 42px;

    transform: translateX(-50%);

    background: #fff2a8;

    box-shadow:
        0 0 8px #fff2a8,
        0 0 25px #ffd86b,
        0 0 55px #ffca45;

    animation:
        bulbFall 2.4s cubic-bezier(.22,.8,.35,1) forwards,
        bulbGlow 1.2s ease-in-out 2.4s infinite alternate;
}

.bulb::before {
    content: "";

    position: absolute;

    width: 14px;
    height: 12px;

    left: 8px;
    bottom: -12px;

    background: #77747a;
}

.bulb::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 100px;

    left: 13px;
    bottom: 42px;

    background: #292b38;
}

@keyframes bulbFall {

    0% {
        top: -120px;
        transform: translateX(-50%) rotate(-12deg);
    }

    70% {
        top: 18%;
        transform: translateX(-50%) rotate(8deg);
    }

    85% {
        top: 15%;
        transform: translateX(-50%) rotate(-4deg);
    }

    100% {
        top: 16%;
        transform: translateX(-50%) rotate(0deg);
    }
}

@keyframes bulbGlow {

    from {
        opacity: 0.85;
    }

    to {
        opacity: 1;
    }
}


/* =========================
   CAKE
========================= */

.cake {

    position: absolute;

    z-index: 10;

    left: 50%;

    bottom: 21%;

    width: 300px;
    height: 270px;

    transform: translateX(-50%);

    opacity: 0;

    animation:
        cakeAppear 4s ease-in-out 5s forwards;
}

/* ---------- TOP TIER ---------- */

.top-tier {

    position: absolute;

    left: 50%;

    bottom: 105px;

    transform: translateX(-50%);

    width: 155px;
    height: 70px;

    background: #4a241b;

    border-radius: 50% 50% 12px 12px;

    border: 5px solid #321611;

    box-shadow:
        inset 0 -12px #3a1b16,
        0 8px 0 #1d0d0b;
}

.top-tier::before {

    content: "";

    position: absolute;

    left: 50%;
    top: -14px;

    transform: translateX(-50%);

    width: 155px;
    height: 30px;

    border-radius: 50%;

    background: #5e2d20;

    border: 5px solid #321611;
}

.top-tier::after {

    content: "";

    position: absolute;

    left: 15px;
    top: 3px;

    width: 125px;
    height: 12px;

    border-radius: 50%;

    background: #f6e6d1;
}


/* ---------- BOTTOM TIER ---------- */

.bottom-tier {

    position: absolute;

    left: 50%;

    bottom: 25px;

    transform: translateX(-50%);

    width: 235px;
    height: 105px;

    background: #51251c;

    border-radius: 50% 50% 15px 15px;

    border: 6px solid #321611;

    box-shadow:
        inset 0 -15px #3b1915,
        0 9px 0 #1d0d0b;
}

.bottom-tier::before {

    content: "";

    position: absolute;

    left: 10px;
    top: 7px;

    width: 200px;
    height: 16px;

    border-radius: 50%;

    background: #f3dfc9;
}

.bottom-tier::after {

    content: "";

    position: absolute;

    left: 25px;
    top: 37px;

    width: 180px;
    height: 5px;

    background: #71382a;

    box-shadow:
        0 28px #71382a;
}


/* =========================
   CAKE DECORATIONS
========================= */

.decoration {

    position: absolute;

    width: 14px;
    height: 14px;

    background: #d9a34d;

    border-radius: 50%;

    z-index: 5;
}

.decoration.one {
    left: 43px;
    bottom: 55px;
}

.decoration.two {
    left: 92px;
    bottom: 35px;

    background: #d76a70;
}

.decoration.three {
    right: 45px;
    bottom: 55px;

    background: #d9a34d;
}

.decoration.four {
    right: 90px;
    bottom: 35px;

    background: #f0d9c2;
}


/* =========================
   CANDLES
========================= */

.candles {

    position: absolute;

    left: 50%;

    bottom: 173px;

    width: 150px;
    height: 70px;

    transform: translateX(-50%);

    z-index: 15;
}

.candle {

    position: absolute;

    width: 8px;
    height: 35px;

    background:
        repeating-linear-gradient(
            135deg,
            #f7e6c9 0px,
            #f7e6c9 5px,
            #d77882 5px,
            #d77882 8px
        );

    border: 1px solid #4a211f;
}


/* =========================
   CANDLE FLAMES
   OFF FOR NOW
========================= */

.flame {

    position: absolute;

    left: 50%;

    top: -16px;

    width: 9px;
    height: 14px;

    transform: translateX(-50%);

    background: #ffd76a;

    border-radius: 50%;

    box-shadow:
        0 0 8px #ffd76a,
        0 0 15px #ffae42;

    opacity: 0;
}


/* =========================
   CANDLE POSITIONS
========================= */

.candle:nth-child(1)  { left: 71px; top: 0; }
.candle:nth-child(2)  { left: 53px; top: 4px; }
.candle:nth-child(3)  { left: 89px; top: 4px; }
.candle:nth-child(4)  { left: 36px; top: 12px; }
.candle:nth-child(5)  { left: 106px; top: 12px; }
.candle:nth-child(6)  { left: 20px; top: 24px; }
.candle:nth-child(7)  { left: 122px; top: 24px; }
.candle:nth-child(8)  { left: 7px; top: 38px; }
.candle:nth-child(9)  { left: 135px; top: 38px; }
.candle:nth-child(10) { left: 27px; top: 47px; }
.candle:nth-child(11) { left: 115px; top: 47px; }
.candle:nth-child(12) { left: 45px; top: 54px; }
.candle:nth-child(13) { left: 97px; top: 54px; }
.candle:nth-child(14) { left: 61px; top: 60px; }
.candle:nth-child(15) { left: 81px; top: 60px; }
.candle:nth-child(16) { left: 34px; top: 28px; }
.candle:nth-child(17) { left: 100px; top: 28px; }
.candle:nth-child(18) { left: 62px; top: 23px; }
.candle:nth-child(19) { left: 80px; top: 23px; }


/* =========================
   CAKE APPEAR ANIMATION
========================= */

@keyframes cakeAppear {

    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(45px)
            scale(0.90);
    }

    25% {
        opacity: 0.12;
        transform:
            translateX(-50%)
            translateY(35px)
            scale(0.92);
    }

    50% {
        opacity: 0.35;
        transform:
            translateX(-50%)
            translateY(22px)
            scale(0.95);
    }

    75% {
        opacity: 0.70;
        transform:
            translateX(-50%)
            translateY(10px)
            scale(0.98);
    }

    100% {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* =========================
   INTRO TEXT
========================= */

.intro {

    position: absolute;

    left: 50%;
    top: 44%;

    transform: translate(-50%, -50%);

    color: #f7df9c;

    font-size: clamp(14px, 2vw, 24px);

    letter-spacing: 4px;

    opacity: 0;

    animation:
        introAppear 1.5s ease-in-out 2.7s forwards,
        introDisappear 3s ease-in-out 4s forwards;
}

@keyframes introAppear {

    from {
        opacity: 0;
        transform: translate(-50%, -45%);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%);
    }
}


@keyframes introDisappear {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

/* =========================
   SURPRISE BANNER
========================= */

.surprise-banner {
    position: absolute;

    z-index: 20;

    left: 50%;
    top: -120px;

    width: 230px;
    height: 70px;

    transform: translateX(-50%);

    background: #f3dfaa;

    border: 5px solid #4a211f;

    box-shadow:
        0 8px 0 #2b1412,
        0 0 18px rgba(243, 223, 170, 0.35);

    opacity: 0;

    animation:
        bannerDrop 1.2s cubic-bezier(.2,.9,.3,1) 9.3s forwards,
        bannerPop 0.5s ease-in-out 12.5s forwards;
}

.banner-text {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #4a211f;

    font-size: 28px;
    font-weight: bold;

    letter-spacing: 3px;

    text-shadow:
        2px 2px 0 #d9a34d;
}


/* ---------- BANNER DROP ---------- */

@keyframes bannerDrop {

    0% {
        top: -120px;
        opacity: 0;
        transform: translateX(-50%) rotate(-8deg);
    }

    70% {
        top: 22%;
        opacity: 1;
        transform: translateX(-50%) rotate(4deg);
    }

    85% {
        top: 19%;
        transform: translateX(-50%) rotate(-2deg);
    }

    100% {
        top: 20%;
        opacity: 1;
        transform: translateX(-50%) rotate(0deg);
    }
}


/* ---------- BANNER POP ---------- */

@keyframes bannerPop {

    0% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }

    30% {
        opacity: 1;
        transform: translateX(-50%) scale(1.12) rotate(-3deg);
    }

    55% {
        opacity: 1;
        transform: translateX(-50%) scale(1.18) rotate(3deg);
    }

    100% {
        opacity: 0;
        transform: translateX(-50%) scale(1.45);
    }
}
/* =========================
   MOBILE
========================= */
   /* =========================
   PIXEL CONFETTI
========================= */

.confetti {
    position: absolute;

    z-index: 25;

    left: 50%;
    top: 20%;

    width: 10px;
    height: 10px;

    pointer-events: none;
}

.confetti span {
    position: absolute;

    width: 7px;
    height: 7px;

    opacity: 0;

    animation: confettiBurst 1.8s ease-out 12.5s forwards;
}


/* CONFETTI COLORS */

.confetti span:nth-child(1),
.confetti span:nth-child(5),
.confetti span:nth-child(9),
.confetti span:nth-child(13) {
    background: #d9a34d;
}

.confetti span:nth-child(2),
.confetti span:nth-child(6),
.confetti span:nth-child(10),
.confetti span:nth-child(14) {
    background: #f3dfc9;
}

.confetti span:nth-child(3),
.confetti span:nth-child(7),
.confetti span:nth-child(11),
.confetti span:nth-child(15) {
    background: #c96b70;
}

.confetti span:nth-child(4),
.confetti span:nth-child(8),
.confetti span:nth-child(12),
.confetti span:nth-child(16) {
    background: #71382a;
}


/* DIFFERENT BURST DIRECTIONS */

.confetti span:nth-child(1)  { --x: -110px; --y: -80px; --r: 140deg; }
.confetti span:nth-child(2)  { --x: -75px;  --y: -105px; --r: 220deg; }
.confetti span:nth-child(3)  { --x: -35px;  --y: -120px; --r: 80deg; }
.confetti span:nth-child(4)  { --x: 10px;   --y: -125px; --r: 190deg; }

.confetti span:nth-child(5)  { --x: 55px;   --y: -110px; --r: 300deg; }
.confetti span:nth-child(6)  { --x: 95px;   --y: -80px;  --r: 120deg; }
.confetti span:nth-child(7)  { --x: 120px;  --y: -35px;  --r: 250deg; }
.confetti span:nth-child(8)  { --x: 105px;  --y: 20px;   --r: 60deg; }

.confetti span:nth-child(9)  { --x: 75px;   --y: 60px;   --r: 170deg; }
.confetti span:nth-child(10) { --x: 25px;   --y: 80px;   --r: 290deg; }
.confetti span:nth-child(11) { --x: -25px;  --y: 75px;   --r: 40deg; }
.confetti span:nth-child(12) { --x: -70px;  --y: 55px;   --r: 210deg; }

.confetti span:nth-child(13) { --x: -105px; --y: 25px;   --r: 330deg; }
.confetti span:nth-child(14) { --x: -120px; --y: -20px;  --r: 100deg; }
.confetti span:nth-child(15) { --x: -85px;  --y: -55px;  --r: 270deg; }
.confetti span:nth-child(16) { --x: 0px;    --y: -95px;  --r: 150deg; }


@keyframes confettiBurst {

    0% {
        opacity: 1;

        transform:
            translate(0, 0)
            rotate(0deg)
            scale(1);
    }

    55% {
        opacity: 1;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(var(--r))
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                var(--x),
                calc(var(--y) + 150px)
            )
            rotate(calc(var(--r) + 180deg))
            scale(0.7);
    }
}

@media (max-width: 600px) {

    .cake {
        transform: translateX(-50%) scale(0.75);
        transform-origin: bottom center;
    }

    .intro {
        font-size: 11px;
        letter-spacing: 2px;
    }

}

</style>
</head>
